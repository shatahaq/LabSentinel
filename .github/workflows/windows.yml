# Builds the Windows programs and installers, and checks them on a real
# Windows machine (GitHub's windows-latest runner, which has an
# administrator account with a logged-in desktop session).
#
#   test     the full pytest suite on Windows (incl. tests marked "windows")
#   build    PyInstaller + Inno Setup -> the two installers (artifact)
#   e2e      installs both from those installers and checks, for real:
#            service running, desktop worker in the user's session, PC paired
#            and connected, recovery after a forced kill, clean uninstall
name: Windows

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dashboard,agent,dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy shared agent dashboard
      - name: Tests
        run: python -m pytest -ra

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dashboard,agent,packaging]"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        run: python packaging/build.py --installer
      - name: Built programs start
        shell: pwsh
        run: |
          & build\dist\LabSentinelAgent\labsentinel-agent.exe --help
          if ($LASTEXITCODE -ne 0) { throw "labsentinel-agent.exe --help failed" }
          & build\dist\LabSentinelDashboard\labsentinel-dashboard.exe --help
          if ($LASTEXITCODE -ne 0) { throw "labsentinel-dashboard.exe --help failed" }
          Get-ChildItem build\installer | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: LabSentinel-installers
          path: build/installer/*.exe
          if-no-files-found: error

  e2e:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write  # only to publish screenshots when a commit asks for it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: LabSentinel-installers
          path: installers
      - name: Tools for the checks (screenshots, browser)
        run: |
          python -m pip install pillow playwright websockets
          python -m playwright install chromium
      - name: Install and start the dashboard
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers\LabSentinelDashboard-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/LOG=dashboard-setup.log" -Wait
          $exe = "C:\Program Files\LabSentinel\Dashboard\labsentinel-dashboard.exe"
          if (-not (Test-Path $exe)) { throw "dashboard not installed" }
          # The runner ends every process a step started when the step ends,
          # so start the dashboard through WMI: it then outlives this step
          # and keeps running for the whole job, like on the supervisor's PC.
          $r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
            CommandLine = "`"$exe`" --keep-running --no-browser"
            CurrentDirectory = "C:\Program Files\LabSentinel\Dashboard"
          }
          if ($r.ReturnValue -ne 0) { throw "could not start the dashboard ($($r.ReturnValue))" }
          "dashboard pid $($r.ProcessId)"
          Start-Sleep -Seconds 15
          Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction Stop | Out-Null
          "dashboard listening on 8765"
          python packaging/ci/ws_probe.py ws://127.0.0.1:8765

      - name: UDP discovery diagnostics
        shell: pwsh
        run: |
          Get-Process labsentinel-dashboard -ErrorAction Stop | Format-Table Id, ProcessName, SessionId
          Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction Stop | Out-Null
          "dashboard still running after its step ended"
          Get-NetUDPEndpoint -LocalPort 50123 -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, OwningProcess,
              @{n="Process"; e={(Get-Process -Id $_.OwningProcess).ProcessName}} | Format-Table -AutoSize
          Get-NetFirewallProfile | Format-Table Name, Enabled, DefaultInboundAction
          Get-NetConnectionProfile | Format-Table Name, InterfaceAlias, NetworkCategory
          python packaging/ci/udp_probe.py

      - name: Install the agent by double-click (pairing window, screenshots)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $code = python packaging/ci/dashboard_state.py code
          "pairing code: $code"
          $setup = Get-ChildItem installers\LabSentinelAgent-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/LOG=agent-setup-gui.log" -PassThru
          python packaging/ci/gui_pairing.py $code shots
          if (-not $p.WaitForExit(180000)) { throw "installer did not finish" }
          "installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 20

      - name: Check service, desktop worker and connection
        shell: pwsh
        run: |
          sc.exe query LabSentinelAgent
          sc.exe qfailure LabSentinelAgent
          Get-CimInstance Win32_Process -Filter "Name LIKE 'labsentinel%'" |
            Select-Object ProcessId, Name, SessionId, CommandLine | Format-Table -AutoSize -Wrap
          icacls C:\ProgramData\LabSentinel\agent\token
          python packaging/ci/dashboard_state.py check-connected

      - name: Dashboard shows this PC's screen (screenshots)
        shell: pwsh
        run: |
          Set-Content -Path praktikum.txt -Value "Praktikum 3 - Perulangan`r`n`r`ndef rata_rata(nilai):`r`n    return sum(nilai) / len(nilai)`r`n`r`nprint(rata_rata([78, 85, 92, 66, 88]))"
          $np = Start-Process notepad.exe -ArgumentList (Resolve-Path praktikum.txt) -PassThru
          Start-Sleep -Seconds 3
          python packaging/ci/dashboard_shots.py shots
          Stop-Process -Id $np.Id -Force -ErrorAction SilentlyContinue

      - name: Kill the service process; it must come back and be reported
        shell: pwsh
        run: |
          $svc = Get-CimInstance Win32_Service -Filter "Name='LabSentinelAgent'"
          "service pid before: $($svc.ProcessId)"
          Stop-Process -Id $svc.ProcessId -Force
          Start-Sleep -Seconds 30
          $svc = Get-CimInstance Win32_Service -Filter "Name='LabSentinelAgent'"
          "service state after: $($svc.State) pid $($svc.ProcessId)"
          if ($svc.State -ne "Running") { throw "service did not restart after a forced kill" }
          python packaging/ci/dashboard_state.py check-tamper

      - name: Uninstall the agent
        shell: pwsh
        run: |
          $un = "C:\Program Files\LabSentinel\Agent\unins000.exe"
          Start-Process $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 5
          sc.exe query LabSentinelAgent
          if ($LASTEXITCODE -eq 0) { throw "service still installed after uninstall" }
          if (Test-Path C:\ProgramData\LabSentinel\agent\token) { throw "token left behind" }
          "uninstalled cleanly"
          exit 0  # sc.exe's "no such service" (1060) above is the expected result

      - name: Silent install for a whole lab (/PAIRCODE)
        shell: pwsh
        run: |
          $code = python packaging/ci/dashboard_state.py code
          $setup = Get-ChildItem installers\LabSentinelAgent-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/PAIRCODE=$code","/DASHBOARD=ws://127.0.0.1:8765","/LOG=agent-setup-silent.log" -Wait
          Start-Sleep -Seconds 15
          sc.exe query LabSentinelAgent
          if ($LASTEXITCODE -ne 0) { throw "silent install: service not installed" }
          if (-not (Test-Path C:\ProgramData\LabSentinel\agent\token)) { throw "silent install: not paired" }
          "silent install paired and running"

      - name: Show logs
        if: always()
        shell: pwsh
        run: |
          $files = @("agent-setup-gui.log", "agent-setup-silent.log",
                     "C:\ProgramData\LabSentinel\agent\logs\agent.log",
                     "C:\ProgramData\LabSentinel\agent\logs\desktop-worker.log",
                     "C:\ProgramData\LabSentinel\agent\logs\setup.log",
                     "C:\ProgramData\LabSentinel\dashboard\logs\dashboard.log")
          foreach ($f in $files) {
            if (Test-Path $f) { "===== $f"; Get-Content $f -Tail 120 }
            else { "===== $f (missing)" }
          }
      - name: Screenshots into the log
        if: always()
        run: python packaging/ci/emit_images.py shots
      - name: Publish screenshots to docs/screenshots/windows
        # Only when the pushed commit asks for it with "[screenshots]"; the
        # commit made here carries [skip ci] so it does not start another run.
        if: >-
          success() && contains(github.event.head_commit.message, '[screenshots]')
          && hashFiles('shots/DISCOVERY-FAILED.txt') == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs\screenshots\windows | Out-Null
          Copy-Item shots\*.png docs\screenshots\windows\ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/windows
          git commit -m "Screenshots from the Windows end-to-end run [skip ci]" -m "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw "no screenshots were committed" }
          # The branch may have moved on while this run was going.
          git pull --rebase origin $env:GITHUB_REF_NAME
          git push origin HEAD:$env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "could not push the screenshots" }
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-logs | Out-Null
          Copy-Item *.log e2e-logs -ErrorAction SilentlyContinue
          Copy-Item C:\ProgramData\LabSentinel\agent\logs\* e2e-logs -ErrorAction SilentlyContinue
          Copy-Item C:\ProgramData\LabSentinel\dashboard\logs\* e2e-logs -ErrorAction SilentlyContinue
          Copy-Item shots e2e-logs -Recurse -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-and-screenshots
          path: e2e-logs
      - name: The agent found the dashboard by itself (UDP discovery)
        shell: pwsh
        run: |
          if (Test-Path shots\DISCOVERY-FAILED.txt) {
            throw "the pairing window did not find the dashboard by discovery; the address had to be typed"
          }
          "discovery worked"
