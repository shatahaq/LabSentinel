<div class="app">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true"><svg><use href="#i-pulse"/></svg></span>
    <span class="brand__name">Lab Sentinel</span>
  </div>

  <header class="topbar">
    <div class="topbar__session" id="topbar-session"></div>
    <div class="topbar__spacer"></div>
    <div class="topbar__actions">
      <button class="btn" id="btn-pause-all">
        <svg class="btn__icon" aria-hidden="true"><use href="#i-pause"/></svg>
        Jeda semua
      </button>
      <button class="btn btn--primary" id="btn-resume-all">
        <svg class="btn__icon" aria-hidden="true"><use href="#i-play"/></svg>
        Lanjutkan semua
      </button>
      <button class="btn btn--icon btn--ghost" id="btn-theme" title="Tema terang/gelap"
              aria-label="Ganti tema terang atau gelap">
        <svg class="btn__icon" aria-hidden="true"><use href="#i-moon" id="theme-icon"/></svg>
      </button>
    </div>
  </header>

  <nav class="sidebar" aria-label="Navigasi utama">
    <button class="nav-item" data-page="beranda" aria-current="page">
      <svg class="nav-item__icon" aria-hidden="true"><use href="#i-home"/></svg><span>Beranda</span>
    </button>
    <button class="nav-item" data-page="monitoring">
      <svg class="nav-item__icon" aria-hidden="true"><use href="#i-grid"/></svg><span>Layar PC</span>
      <span class="nav-item__badge" id="nav-badge" hidden>0</span>
    </button>
    <button class="nav-item" data-page="aturan">
      <svg class="nav-item__icon" aria-hidden="true"><use href="#i-sliders"/></svg><span>Aturan</span>
    </button>
    <button class="nav-item" data-page="laporan">
      <svg class="nav-item__icon" aria-hidden="true"><use href="#i-report"/></svg><span>Laporan</span>
    </button>
    <button class="nav-item" data-page="aktivitas">
      <svg class="nav-item__icon" aria-hidden="true"><use href="#i-history"/></svg><span>Catatan aktivitas</span>
    </button>
  </nav>

  <main class="main" id="main">
    <!-- Beranda -->
    <section class="page is-active" id="page-beranda" aria-labelledby="t-beranda">
      <div class="page__head">
        <div>
          <h1 class="page__title" id="t-beranda">Beranda</h1>
        </div>
        <div class="page__actions" id="session-actions"></div>
      </div>
      <div id="dry-run-banner"></div>
      <div class="stat-row" id="stats"></div>
      <div class="grid-2">
        <div class="card">
          <div class="card__head">
            <span class="card__title">Pelanggaran terbaru</span>
            <div class="card__actions">
              <button class="btn btn--sm btn--ghost" data-goto="laporan">Lihat semua</button>
            </div>
          </div>
          <div class="feed" id="recent-feed"></div>
        </div>
        <div class="card">
          <div class="card__head"><span class="card__title">Sesi</span></div>
          <div class="card__body" id="session-panel"></div>
        </div>
      </div>
    </section>

    <!-- Monitoring -->
    <section class="page" id="page-monitoring" aria-labelledby="t-monitoring">
      <div class="page__head">
        <div>
          <h1 class="page__title" id="t-monitoring">Layar PC</h1>
          <p class="page__subtitle" id="monitoring-sub">Klik PC untuk melihat layarnya lebih besar.</p>
        </div>
        <div class="page__actions">
          <button class="btn btn--sm" id="btn-select-mode">Pilih PC</button>
        </div>
      </div>

      <div class="toolbar">
        <label class="field" style="min-width:220px">
          <svg class="field__icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="search" id="pc-search" placeholder="Cari PC atau pengguna" aria-label="Cari PC">
        </label>
        <div class="segmented" role="group" aria-label="Saring berdasarkan status">
          <button data-filter="all" aria-pressed="true">Semua</button>
          <button data-filter="online" aria-pressed="false">Aktif</button>
          <button data-filter="paused" aria-pressed="false">Dijeda</button>
          <button data-filter="dropped" aria-pressed="false">Terputus</button>
          <button data-filter="offline" aria-pressed="false">Mati</button>
        </div>
        <div class="topbar__spacer"></div>
        <div id="selection-bar" hidden></div>
      </div>

      <div class="pc-grid" id="pc-grid"></div>
    </section>

    <!-- Aturan -->
    <section class="page" id="page-aturan" aria-labelledby="t-aturan">
      <div class="page__head">
        <div>
          <h1 class="page__title" id="t-aturan">Aturan</h1>
        </div>
      </div>
      <div id="rules-content"></div>
    </section>

    <!-- Laporan -->
    <section class="page" id="page-laporan" aria-labelledby="t-laporan">
      <div class="page__head">
        <div>
          <h1 class="page__title" id="t-laporan">Laporan</h1>
        </div>
        <div class="page__actions" id="report-actions"></div>
      </div>
      <div class="card"><div class="table-wrap" id="violations-table"></div></div>
    </section>

    <!-- Aktivitas -->
    <section class="page" id="page-aktivitas" aria-labelledby="t-aktivitas">
      <div class="page__head">
        <div>
          <h1 class="page__title" id="t-aktivitas">Catatan aktivitas</h1>
          <p class="page__subtitle">Tidak bisa diubah atau dihapus dari dashboard.</p>
        </div>
      </div>
      <div class="card"><div class="table-wrap" id="audit-table"></div></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
