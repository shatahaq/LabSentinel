[package]
name = "labsentinel-agent"
version = "0.1.3"
edition = "2021"
rust-version = "1.80"
description = "Lab Sentinel agent for lab PCs (native Rust build)"
license = "MIT"

[dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.4.3"
jpeg-encoder = "0.7.1"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio = { version = "1.53.3", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = "0.61.2"

# Small, self-contained executable: the whole point of the Rust agent.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
