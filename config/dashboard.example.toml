# Contoh konfigurasi Dashboard Lab Sentinel (PC pengawas). Semua baris opsional.
# Simpan sebagai dashboard.toml di samping labsentinel-dashboard.exe
# (mis. C:\Program Files\LabSentinel\Dashboard\dashboard.toml), atau berikan
# dengan --config saat menjalankan dari kode sumber.

data_dir = "C:/ProgramData/LabSentinel/dashboard"
log_level = "INFO"
dashboard_name = "Lab Sentinel - Lab A"

# Server WebSocket untuk agent (dengarkan di semua antarmuka LAN).
ws_host = "0.0.0.0"
ws_port = 8765

# Beacon UDP discovery.
discovery_port = 50123
beacon_interval_s = 3.0
# advertise_host = "10.0.0.5"   # IP LAN yang diumumkan; autodetect bila kosong

# UI admin (Eel) — hanya localhost.
eel_host = "localhost"
eel_port = 8080

# Pemasangan PC memakai kode 6 digit (lihat halaman Aturan); token tiap PC
# disimpan sebagai hash di basis data. Tidak ada token bersama yang perlu diatur.

default_mode = "lab"       # exam | lab | free
default_dry_run = true     # audit-only saat pertama dipasang
heartbeat_timeout_s = 15.0 # PC dianggap 'dropped' bila tak ada heartbeat sekian detik
retention_days = 30        # hapus otomatis data lebih lama dari ini
